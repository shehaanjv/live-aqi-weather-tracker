<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1c1e;
            color: white;
            text-align: center;
            margin: 0;
        }

        .points {
            font-size: 22px;
            font-weight: bold;
            padding: 15px;
            background-color: #343a40;
            border-bottom: 2px solid white;
            width: 80%;
            margin: auto;
            text-align: center;
            border-radius: 5px;
        }

        .column {
            width: 80%;
            margin: 20px auto;
            border-top: 2px solid #ddd;
            padding: 15px;
            background-color: white;
            min-height: 200px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            color: black;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Weather & AQI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="aqi1.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="weather.html">Weather</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="store.html">Store</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <p class="points">Total Points: <span id="totalPoints">0</span></p>

    <div id="taskSection">
        <div class="column" id="pendingTasks">
            <h2>Pending Tasks</h2>
        </div>
        <div class="column" id="completedTasks">
            <h2>Completed Tasks</h2>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // Firebase configuration (Replace with your actual Firebase project credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyD0010tuukyiUU7TWlxEE5jfwS_aG0eYLE",

authDomain: "eco-app-66edf.firebaseapp.com",

projectId: "eco-app-66edf",

storageBucket: "eco-app-66edf.firebasestorage.app",

messagingSenderId: "1066161952442",

appId: "1:1066161952442:web:05510d018385b9bf93d483",

measurementId: "G-JRE9ZB4XX2"

        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const tasks = [
            { text: "Check Today's AQI", points: 10 },
            { text: "Sign up for an Event", points: 20 },
            { text: "Use Public Transport", points: 15 }
        ];

        const pendingContainer = document.getElementById("pendingTasks");
        const completedContainer = document.getElementById("completedTasks");
        const pointsDisplay = document.getElementById("totalPoints");

        let currentUser = null;

        async function updateUserPoints(userId, points) {
            const userRef = doc(db, "users", userId);
            const userSnap = await getDoc(userRef);

            let totalPoints = 0;
            if (userSnap.exists()) {
                totalPoints = userSnap.data().points || 0;
            }

            totalPoints += points;

            if (userSnap.exists()) {
                await updateDoc(userRef, { points: totalPoints });
            } else {
                await setDoc(userRef, { points: totalPoints });
            }

            pointsDisplay.innerText = totalPoints;
        }

        async function fetchUserPoints(userId) {
            const userRef = doc(db, "users", userId);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                return userSnap.data().points || 0;
            } else {
                await setDoc(userRef, { points: 0 });
                return 0;
            }
        }

        function createTaskElement(task, isCompleted = false) {
            let div = document.createElement("div");
            div.classList.add("task");
            div.innerHTML = `
                <span>${task.text} (${task.points} points)</span>
                <input type="checkbox" data-points="${task.points}" ${isCompleted ? "checked" : ""}>
            `;

            div.querySelector("input").addEventListener("change", async function () {
                if (!currentUser) {
                    alert("You must be logged in to complete tasks.");
                    this.checked = false;
                    return;
                }

                let points = parseInt(this.getAttribute("data-points"));
                if (this.checked) {
                    await updateUserPoints(currentUser.uid, points);
                    completedContainer.appendChild(div);
                } else {
                    await updateUserPoints(currentUser.uid, -points);
                    pendingContainer.appendChild(div);
                }
            });

            return div;
        }

        async function loadTasks(userId) {
            pendingContainer.innerHTML = "<h2>Pending Tasks</h2>";
            completedContainer.innerHTML = "<h2>Completed Tasks</h2>";

            const userRef = doc(db, "users", userId);
            const userSnap = await getDoc(userRef);
            let completedTaskIndexes = [];

            if (userSnap.exists() && userSnap.data().completedTasks) {
                completedTaskIndexes = userSnap.data().completedTasks;
            }

            tasks.forEach((task, index) => {
                if (completedTaskIndexes.includes(index)) {
                    completedContainer.appendChild(createTaskElement(task, true));
                } else {
                    pendingContainer.appendChild(createTaskElement(task, false));
                }
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                console.log("User logged in:", user.email);

                const totalPoints = await fetchUserPoints(user.uid);
                pointsDisplay.innerText = totalPoints;

                await loadTasks(user.uid);
            } else {
                console.log("No user logged in. Tasks will not update points.");
                loadTasks("guest");
            }
        });
    </script>

</body>
</html>
