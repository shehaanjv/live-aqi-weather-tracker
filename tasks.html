<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --task-bg: #fff;
            --border-color: #ddd;
            --task-border: #ccc;
            --primary-color: black;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background-color: #1a1c1e;
        }

        .points {
            font-size: 22px;
            font-weight: bold;
            padding: 15px;
            color: var(--primary-color);
            background-color: var(--task-bg);
            border-bottom: 2px solid var(--border-color);
            width: 80%;
            margin: auto;
            text-align: center;
        }

        .column {
            width: 80%;
            margin: 20px auto;
            border-top: 2px solid var(--border-color);
            padding: 15px;
            background-color: var(--task-bg);
            min-height: 200px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--task-bg);
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--task-border);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-transparent" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Weather & AQI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="aqi1.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="weather.html">Weather</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tasks.html">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="store.html">Store</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <p class="points">Total Points: <span id="totalPoints">0</span></p>

    <div id="taskSection">
        <div class="column" id="pendingTasks">
            <h2>Pending Tasks</h2>
        </div>
        <div class="column" id="completedTasks">
            <h2>Completed Tasks</h2>
        </div>
    </div>

    <script>
        sessionStorage.setItem("totalPoints", "0");

        let totalPoints = 0;
        const tasks = [
            { text: "Check Today's AQI", points: 10 },
            { text: "Sign up for an Event", points: 20 },
            { text: "Use Public Transport", points: 15 }
        ];

        const pendingContainer = document.getElementById("pendingTasks");
        const completedContainer = document.getElementById("completedTasks");
        const pointsDisplay = document.getElementById("totalPoints");

        function updatePointsDisplay() {
            pointsDisplay.innerText = totalPoints;
            sessionStorage.setItem("totalPoints", totalPoints);
        }

        function createTaskElement(task) {
            let div = document.createElement("div");
            div.classList.add("task");
            div.innerHTML = `
                <span>${task.text} (${task.points} points)</span>
                <input type="checkbox" data-points="${task.points}">
            `;
            div.querySelector("input").addEventListener("change", function() {
                let points = parseInt(this.getAttribute("data-points"));
                if (this.checked) {
                    totalPoints += points;
                    completedContainer.appendChild(div);
                } else {
                    totalPoints -= points;
                    pendingContainer.appendChild(div);
                }
                updatePointsDisplay();
            });
            return div;
        }

        tasks.forEach(task => {
            pendingContainer.appendChild(createTaskElement(task));
        });

        updatePointsDisplay();
    </script>

</body>
</html>
