<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker & Shop</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --task-bg: #fff;
            --border-color: #ddd;
            --task-border: #ccc;
            --primary-color: #4CAF50;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background-color: var(--bg-color);
        }

        .nav {
            background-color: var(--primary-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .nav button {
            background: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .points {
            font-size: 22px;
            font-weight: bold;
            padding: 15px;
            color: var(--primary-color);
            background-color: var(--task-bg);
            border-bottom: 2px solid var(--border-color);
            width: 80%;
            margin: auto;
            text-align: center;
        }

        .column, .shop-container {
            width: 80%;
            margin: 20px auto;
            border-top: 2px solid var(--border-color);
            padding: 15px;
            background-color: var(--task-bg);
            min-height: 200px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .task, .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--task-bg);
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--task-border);
            border-radius: 5px;
        }

        .task input {
            transform: scale(1.3);
            cursor: pointer;
        }

        .shop-container {
            display: none;
            padding: 20px;
        }

        .shop-item img {
            width: 50px;
            height: 50px;
            border-radius: 5px;
        }

        .shop-item button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="nav">
        <button onclick="showTasks()">Task Tracker</button>
        <button onclick="showShop()">Shop</button>
    </div>

    <p class="points">Total Points: <span id="totalPoints">0</span></p>

    <!-- Task Tracker Section -->
    <div id="taskSection">
        <div class="column" id="pendingTasks">
            <h2>Pending Tasks</h2>
        </div>
        <div class="column" id="completedTasks">
            <h2>Completed Tasks</h2>
        </div>
    </div>

    <!-- Shop Section -->
    <div class="shop-container" id="shopSection">
        <h2>Shop</h2>
        <div class="shop-item">
            <img src="https://via.placeholder.com/50" alt="Item 1">
            <span>Notebook (15 Points)</span>
            <button onclick="buyItem(15)">Buy</button>
        </div>
        <div class="shop-item">
            <img src="https://via.placeholder.com/50" alt="Item 2">
            <span>Pen (10 Points)</span>
            <button onclick="buyItem(10)">Buy</button>
        </div>
        <div class="shop-item">
            <img src="https://via.placeholder.com/50" alt="Item 3">
            <span>Gift Card (30 Points)</span>
            <button onclick="buyItem(30)">Buy</button>
        </div>
    </div>

    <script>
        let totalPoints = 0;
        const tasks = [
            { text: "Complete a coding challenge", points: 10 },
            { text: "Read an article on leadership", points: 5 },
            { text: "Write a summary of a case study", points: 15 }
        ];

        const pendingContainer = document.getElementById("pendingTasks");
        const completedContainer = document.getElementById("completedTasks");
        const taskSection = document.getElementById("taskSection");
        const shopSection = document.getElementById("shopSection");
        const pointsDisplay = document.getElementById("totalPoints");

        function createTaskElement(task) {
            let div = document.createElement("div");
            div.classList.add("task");
            div.innerHTML = `
                <span>${task.text} (${task.points} points)</span>
                <input type="checkbox" data-points="${task.points}">
            `;
            div.querySelector("input").addEventListener("change", function() {
                let points = parseInt(this.getAttribute("data-points"));
                if (this.checked) {
                    totalPoints += points;
                    completedContainer.appendChild(div);
                } else {
                    totalPoints -= points;
                    pendingContainer.appendChild(div);
                }
                pointsDisplay.innerText = totalPoints;
            });
            return div;
        }

        tasks.forEach(task => {
            pendingContainer.appendChild(createTaskElement(task));
        });

        function showTasks() {
            taskSection.style.display = "block";
            shopSection.style.display = "none";
        }

        function showShop() {
            taskSection.style.display = "none";
            shopSection.style.display = "block";
        }

        function buyItem(cost) {
            if (totalPoints >= cost) {
                totalPoints -= cost;
                pointsDisplay.innerText = totalPoints;
                alert("You purchased the item!");
            } else {
                alert("Not enough points!");
            }
        }
    </script>

</body>
</html>
