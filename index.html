<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AQI & Weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style1.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Weather & AQI</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="weather.html">Weather</a></li>
          <li class="nav-item"><a class="nav-link" href="tasks.html">Tasks</a></li>
          <li class="nav-item"><a class="nav-link" href="store.html">Store</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
        </ul>
        <div class="ms-auto">
          <button id="loginBtn" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
          <button id="signupBtn" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#signupModal">Sign Up</button>
          <button id="logoutBtn" class="btn btn-danger d-none">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="text-center">Live AQI & Weather</h1>
    <input type="text" id="cityInput" class="form-control w-50 mx-auto" placeholder="Enter city name">
    <button id="searchButton" class="btn btn-primary mt-2">Search</button>
    <div id="resultsDiv" class="result mt-3"></div>
  </div>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">Welcome Back</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Email">
                <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password">
                <p id="loginError" class="text-danger text-center d-none"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button id="loginSubmit" class="btn btn-primary">Login</button>
            </div>
        </div>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="signupModalLabel">Create an Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="email" id="signupEmail" class="form-control mb-2" placeholder="Email">
                <input type="password" id="signupPassword" class="form-control mb-2" placeholder="Password">
                <p id="signupError" class="text-danger text-center d-none"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button id="signupSubmit" class="btn btn-primary">Sign Up</button>
            </div>
        </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
      import { auth, signupUser, loginUser } from "./firebase.js";
      import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

      const loginBtn = document.getElementById("loginBtn");
      const signupBtn = document.getElementById("signupBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const loginSubmit = document.getElementById("loginSubmit");
      const signupSubmit = document.getElementById("signupSubmit");
      const loginError = document.getElementById("loginError");
      const signupError = document.getElementById("signupError");

      function showErrorMessage(error, element) {
          element.innerText = error.message;
          element.classList.remove("d-none");
      }

      loginSubmit.addEventListener("click", async () => {
          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;
          try {
              await loginUser(email, password);
              loginError.classList.add("d-none");
              alert("Login successful!");
              location.reload();
          } catch (error) {
              showErrorMessage(error, loginError);
          }
      });

      signupSubmit.addEventListener("click", async () => {
          const email = document.getElementById("signupEmail").value;
          const password = document.getElementById("signupPassword").value;
          try {
              await signupUser(email, password);
              signupError.classList.add("d-none");
              alert("Account created successfully!");
              location.reload();
          } catch (error) {
              showErrorMessage(error, signupError);
          }
      });

      logoutBtn.addEventListener("click", async () => {
          await signOut(auth);
          alert("Logged out successfully!");
          location.reload();
      });

      onAuthStateChanged(auth, (user) => {
          if (user) {
              loginBtn.classList.add("d-none");
              signupBtn.classList.add("d-none");
              logoutBtn.classList.remove("d-none");
          } else {
              loginBtn.classList.remove("d-none");
              signupBtn.classList.remove("d-none");
              logoutBtn.classList.add("d-none");
          }
      });
  </script>
 <script src="script2.js"></script>
</body>
</html>
