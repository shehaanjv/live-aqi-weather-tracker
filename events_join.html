<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Weather & AQI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="aqi1.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="text-center">Create a New Event</h2>

        <div class="mb-3">
            <label class="form-label">Event Name</label>
            <input type="text" id="eventName" class="form-control" placeholder="Enter event name">
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" id="eventLocation" class="form-control" placeholder="Enter event location">
        </div>

        <div class="mb-3">
            <label class="form-label">Event Type</label>
            <select id="eventType" class="form-select">
                <option selected>Select Event Type</option>
                <option value="Beach Cleanup">Beach Cleanup</option>
                <option value="Recycling Drive">Recycling Drive</option>
                <option value="Carpool">Carpool</option>
                <option value="Tree Planting">Tree Planting</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Event Description</label>
            <textarea id="eventDescription" class="form-control" rows="3" placeholder="Describe the event"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Link</label>
            <input type="text" id="eventLink" class="form-control" placeholder="Enter any text or link">
        </div>

        <button id="submitEvent" class="btn btn-primary">Create Event</button>
    </div>

    <script type="module">
        import { auth, createEvent } from "./firebase.js";

        document.getElementById("submitEvent").addEventListener("click", async () => {
            const user = auth.currentUser;
            if (!user) {
                alert("You must be logged in to create an event.");
                return;
            }

            const name = document.getElementById("eventName").value.trim();
            const location = document.getElementById("eventLocation").value.trim();
            const type = document.getElementById("eventType").value;
            const description = document.getElementById("eventDescription").value.trim();
            const eventLink = document.getElementById("eventLink").value.trim();

            if (!name || !location || type === "Select Event Type" || !description || !eventLink) {
                alert("Please fill in all fields.");
                return;
            }

            await createEvent(user.uid, name, location, type, description, eventLink);
            alert("Event Created!");
            window.location.href = "events.html";
        });
    </script>

</body>
</html>
