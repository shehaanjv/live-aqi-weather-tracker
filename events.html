<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Weather & AQI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="aqi1.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="weather.html">Weather</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="store.html">Store</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Events</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="text-center">Upcoming Events</h2>
        <div id="eventList" class="row mt-3"></div>

        <h3 class="text-center mt-4">Create an Event</h3>
        <div class="input-group mt-3">
            <input type="text" id="eventName" class="form-control" placeholder="Enter event name">
            <input type="text" id="eventLocation" class="form-control" placeholder="Enter event location">
            <input type="text" id="eventDescription" class="form-control" placeholder="Enter event description">
            <input type="text" id="eventLink" class="form-control" placeholder="Enter event link">
            <button id="createEventBtn" class="btn btn-primary">Create Event</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        // Firebase configuration (Replace with your actual Firebase project credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyD0010tuukyiUU7TWlxEE5jfwS_aG0eYLE",

authDomain: "eco-app-66edf.firebaseapp.com",

projectId: "eco-app-66edf",

storageBucket: "eco-app-66edf.firebasestorage.app",

messagingSenderId: "1066161952442",

appId: "1:1066161952442:web:05510d018385b9bf93d483",

measurementId: "G-JRE9ZB4XX2"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const eventList = document.getElementById("eventList");
        const createEventBtn = document.getElementById("createEventBtn");

        async function loadEvents() {
            eventList.innerHTML = ""; // Clear previous events

            const eventsSnapshot = await getDocs(collection(db, "events"));
            eventsSnapshot.forEach(docSnapshot => {
                const eventData = docSnapshot.data();

                const eventCard = document.createElement("div");
                eventCard.classList.add("col-md-6", "mb-3");

                eventCard.innerHTML = `
                    <div class="card mb-3" style="max-width: 540px;">
                        <div class="row g-0">
                            <div class="col-md-4">
                                <img src="event-placeholder.jpg" class="img-fluid rounded-start" alt="Event Image">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title">${eventData.name}</h5>
                                    <h6 class="card-title">${eventData.location}</h6>
                                    <p class="card-text">${eventData.description}</p>
                                    <a href="${eventData.eventLink}" target="_blank" class="btn btn-primary">Visit Link</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                eventList.appendChild(eventCard);
            });
        }

        async function createNewEvent() {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    alert("You must be logged in to create an event.");
                    return;
                }

                const name = document.getElementById("eventName").value;
                const location = document.getElementById("eventLocation").value;
                const description = document.getElementById("eventDescription").value;
                const eventLink = document.getElementById("eventLink").value;

                if (name.trim() === "" || location.trim() === "" || description.trim() === "" || eventLink.trim() === "") {
                    alert("Please fill in all event details.");
                    return;
                }

                await addDoc(collection(db, "events"), {
                    name: name,
                    location: location,
                    description: description,
                    eventLink: eventLink,
                    createdBy: user.uid
                });

                alert("Event Created!");
                loadEvents(); // Refresh event list
            });
        }

        createEventBtn.addEventListener("click", createNewEvent);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadEvents();
            } else {
                alert("You must be logged in to view events.");
                window.location.href = "aqi1.html"; // Redirect to login/signup page
            }
        });
    </script>

</body>
</html>
